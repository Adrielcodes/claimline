name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: .NET build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Claimline.slnx
      - run: dotnet build Claimline.slnx --no-restore -c Release
      # Integration tests start a real SQL Server with Testcontainers (Docker is available on ubuntu runners).
      - run: dotnet test --solution Claimline.slnx --no-build -c Release

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infra:
    name: Bicep build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: az bicep install
      - run: |
          az bicep build --file infra/registry.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          az bicep build --file infra/main.bicep --stdout > /dev/null

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/Claimline.Api/Dockerfile -t claimline-api .
      - run: docker build -f src/Claimline.Worker/Dockerfile -t claimline-worker .
      - run: docker build -t claimline-web web

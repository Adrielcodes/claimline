name: Deploy to Azure

# Keyless: GitHub's OIDC token is exchanged for an Entra ID token through a federated credential.
# One-time setup is in docs/deploy.md. The job is skipped until the AZURE_* repository variables exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      LOCATION: ${{ vars.AZURE_LOCATION }}
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Registry
        id: registry
        run: |
          az group create -n "$RG" -l "$LOCATION" --tags app=claimline -o none
          out=$(az deployment group create -g "$RG" -f infra/registry.bicep -p location="$LOCATION" --query properties.outputs -o json)
          echo "name=$(jq -r .name.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "server=$(jq -r .loginServer.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Build and push images
        env:
          SERVER: ${{ steps.registry.outputs.server }}
        run: |
          az acr login -n "${{ steps.registry.outputs.name }}"
          docker build -f src/Claimline.Api/Dockerfile -t "$SERVER/claimline-api:$TAG" .
          docker build -f src/Claimline.Worker/Dockerfile -t "$SERVER/claimline-worker:$TAG" .
          docker build -t "$SERVER/claimline-web:$TAG" web
          for image in api worker web; do docker push "$SERVER/claimline-$image:$TAG"; done

      - name: Deploy infrastructure and apps
        id: deploy
        run: |
          out=$(az deployment group create -g "$RG" -f infra/main.bicep \
            -p location="$LOCATION" imageTag="$TAG" deployOpenAI=${{ vars.DEPLOY_OPENAI || 'true' }} \
            --query properties.outputs -o json)
          echo "web=$(jq -r .webUrl.value <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "api=$(jq -r .apiUrl.value <<<"$out")" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${{ steps.deploy.outputs.api }}/health/ready"; then break; fi
            echo "waiting for API ($i)"; sleep 10
          done
          curl -fsS "${{ steps.deploy.outputs.api }}/api/stats"
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: ${{ steps.deploy.outputs.web }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API docs: ${{ steps.deploy.outputs.api }}/scalar" >> "$GITHUB_STEP_SUMMARY"
